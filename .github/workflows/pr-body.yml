# No pull request body or first comment carries an AI attribution line
# (David's rule, all five FSG repos, 16 Sep 2026; `fsg-estimating-crm` went
# first). Its own workflow, not a step in ci.yml, because it has to run on
# `edited` as well -- a body fixed after the fact should turn the check
# green without a new commit -- and adding `edited` to ci.yml's trigger
# would re-run the whole suite on every body edit.
#
# Self-hosted, 24 Sep 2026 (org-wide hosted-minutes push, matching
# fsg-estimating-crm#1099 and fsg-tender-review's own pr-body.yml). This job
# used to run on ubuntu-latest with the reasoning kept above until now --
# "a two-second check ... should not wait on the self-hosted fsg-linux
# runner" -- and fsg-estimating-crm#1099 (22 Sep 2026) found that reasoning
# breaks the night GitHub Actions billing lapses: both of that repo's hosted
# jobs never started and reported "The job was not started because recent
# account payments have failed," which several lanes chased as a phantom
# CI failure. This job needs no NAS, no secret and no full install -- just
# Python and the gh/GitHub context, both already on the self-hosted
# `fsg-linux` pool that `ci.yml`'s own jobs use. Moving it there removes the
# billing-outage failure mode and runs it on the pool that's already paid
# for, at zero hosted cost.
name: PR body

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# One run per PR ref. A body edit or a new push supersedes any run this
# workflow already has in flight for the same PR.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-body:
    name: PR body (no AI attribution line)
    runs-on: [self-hosted, fsg-linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # The earliest issue comment on the PR, or `[]`. Fetched here rather
      # than inside the script so the script stays stdlib and testable.
      - name: Fetch the first comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments?per_page=1"
          > first-comment.json

      - name: Check the body
        run: python3 scripts/check_pr_body.py --event "$GITHUB_EVENT_PATH" --comments first-comment.json
